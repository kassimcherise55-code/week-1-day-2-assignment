<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenya in Pictures — Gallery</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">FastSend</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="sticky-nav.html">Sticky Nav</a></li>
            </ul>
        </div>
    </header>

    <main class="gallery-page">
        <header class="gallery-header">
            <h1>Kenya in Pictures</h1>
            <p>Exploring the vibrant landscapes, wildlife, and technology across Kenya.</p>
        </header>

        <section class="gallery-grid">
            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=1" alt="Nairobi Skyline">
                <figcaption>Nairobi City Skyline</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=2" alt="Mount Kenya National Park">
                <figcaption>Mount Kenya Peaks</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=3" alt="Maasai Mara Wildlife">
                <figcaption>Maasai Mara Wildlife</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=4" alt="Mombasa Coastal Beaches">
                <figcaption>Mombasa Coastline</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=5" alt="Great Rift Valley Views">
                <figcaption>Great Rift Valley</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=6" alt="Lake Nakuru Flamingos">
                <figcaption>Lake Nakuru National Park</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=7" alt="Silicon Savannah Tech Hub">
                <figcaption>Konza Technopolis Hub</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=8" alt="Tea Plantations in Kericho">
                <figcaption>Kericho Tea Estates</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=9" alt="Amboseli Elephant Sanctuary">
                <figcaption>Amboseli Elephants</figcaption>
            </figure>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-left">
                <p>&copy; 2026 FastSend Kenya. All rights reserved.</p>
            </div>
            <div class="footer-right">
                <a href="index.html">Home</a>
                <a href="sticky-nav.html">FAQ</a>
            </div>
        </div>
    </footer>

</body>
</html>
