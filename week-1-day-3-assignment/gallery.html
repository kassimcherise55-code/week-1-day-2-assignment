<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastSend - Send Money Instantly Across Kenya</title>
    <!--Google Font-->  
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-4.css">
</head>
<body>
    <!-- Header Title and Subtitle-->
    <header>
       <h1>Kenya in Pictures</h1>
       <p>A visual showcase exploring the landscapes, wildlife, and vibrant urban culture of Kenya.</p>     
    </header>

    <!--CSS Grid Gallery Container-->
    <main class="gallery-container">

        <figure class="gallery-item">
            <img src="https://picsum.photos/400/300?random=1" alt="Nairobi Skyline at Dusk">
            <figcaption>Nairobi Skyline at Dusk</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://picsum.photos/400/300?random=2" alt="Wild Elephants in Amboseli">
            <figcaption>Wild Elephants in Amboseli</figcaption>
        </figure>

        <figure class="gallery-item"> 
            <img src="https://picsum.photos/400/300?random=3" alt="Sunrise over Mount Kenya">
            <figcaption>Sunrise over Mount Kenya</figcaption>

        <figure class="gallery-item">
            <img src="https://picsum.photos/400/300?random=4" alt="Mombasa Coastal Beach">
            <figcaption>Mombasa Coastal Beach</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://picsum.photos/400/300?random=5" alt="Great Rift Valley Views">
            <figcaption>Great Rift Valley Views</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://picsum.photos/400/300?random=6" alt="Maasai Mara Savanna">
            <figcaption>Maasai Mara Savanna</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://picsum.photos/400/300?random=7" alt="Flamingos at Lake Nakuru">
            <figcaption>Flamingos at Lake Nakuru</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://picsum.photos/400/300?random=8" alt="Lamu Old Town Streets">
            <figcaption>Lamu Old Town Streets</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://picsum.photos/400/300?random=9" alt="Tea Plantations in Kericho">
            <figcaption>Tea Plantations in Kericho</figcaption>
        </figure>
    </body>
     </main>
